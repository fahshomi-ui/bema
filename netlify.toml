[build]
  command = "npm ci && node scripts/inject-socket-url.cjs && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NETLIFY_SKIP_SECRETS_SCAN = "true"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/offers"
  to = "/.netlify/functions/offers"
  status = 200

[[redirects]]
  from = "/credit-card-payment"
  to = "/index.html"
  status = 200
